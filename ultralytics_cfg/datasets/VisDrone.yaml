# VisDrone dataset configuration for CMIFES-YOLO.
# Convert the official VisDrone folders with:
#   python scripts/convert_visdrone_to_yolo.py --input datasets/VisDrone2019 --output datasets/VisDrone-YOLO

path: datasets/VisDrone-YOLO
train: images/train
val: images/val
test: images/test

nc: 10
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
